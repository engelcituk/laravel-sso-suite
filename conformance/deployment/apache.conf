ServerName deployment-laboratory
ServerTokens Prod
ServerSignature Off
SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
<Directory /app/.runtime/deployment-lab>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    FallbackResource /index.php
</Directory>
<VirtualHost *:80>
    ServerName identity.idp-alt.test
    DocumentRoot /app/.runtime/deployment-lab/apache/op/public
    CustomLog /dev/null common
</VirtualHost>
<VirtualHost *:80>
    ServerName one.rp-one-alt.test
    DocumentRoot /app/.runtime/deployment-lab/apache/one/public
    CustomLog /dev/null common
</VirtualHost>
<VirtualHost *:80>
    ServerName two.rp-two-alt.test
    DocumentRoot /app/.runtime/deployment-lab/apache/two/public
    CustomLog /dev/null common
</VirtualHost>
