events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    ssl_certificate /tls/server.pem;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    map $host $fpm_app {
        identity.idp.test op;
        one.rp-one.test one;
        two.rp-two.test two;
    }
    server { listen 443 ssl default_server; server_name _; return 444; }
    server {
        listen 443 ssl;
        server_name identity.idp.test one.rp-one.test two.rp-two.test;
        root /app/.runtime/deployment-lab/fpm/$fpm_app/public;
        index index.php;
        set $maintenance 0;
        if (-f /control/fpm-down) { set $maintenance 1; }
        if ($host != identity.idp.test) { set $maintenance 0; }
        if ($maintenance = 1) { return 503; }
        location = /.well-known/openid-configuration { try_files $uri /index.php?$query_string; }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_FORWARDED_PORT 443;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_pass fpm:9000;
        }
        location ~ /\. { deny all; }
    }
    server {
        listen 443 ssl;
        server_name identity.idp-alt.test one.rp-one-alt.test two.rp-two-alt.test;
        location / {
            proxy_pass http://apache:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
