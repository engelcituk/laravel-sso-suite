services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${LAB_PASSWORD:?}
      MYSQL_DATABASE: fpm_op
      MYSQL_USER: sso_lab
      MYSQL_PASSWORD: ${LAB_PASSWORD:?}
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/lab.sql:ro
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -usso_lab fpm_op -e "SELECT 1" >/dev/null']
      interval: 3s
      retries: 50
      timeout: 3s
    networks: [laboratory]
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: apache_op
      POSTGRES_USER: sso_lab
      POSTGRES_PASSWORD: ${LAB_PASSWORD:?}
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/lab.sql:ro
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, sso_lab, -d, apache_op]
      interval: 3s
      retries: 50
      timeout: 3s
    networks: [laboratory]
  fpm:
    image: laravel-sso-deployment-fpm:local
    build:
      context: .
      dockerfile: php.Dockerfile
      args: {PHP_FLAVOR: 8.3-fpm-bookworm}
    volumes: [application:/app, './php-fpm.conf:/usr/local/etc/php-fpm.d/zz-lab.conf:ro']
    healthcheck:
      test: [CMD, php, '-r', "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [laboratory]
  apache:
    image: laravel-sso-deployment-apache:local
    build:
      context: .
      dockerfile: php.Dockerfile
      args: {PHP_FLAVOR: 8.4-apache-bookworm}
    volumes: [application:/app, './apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro']
    healthcheck:
      test: [CMD, php, '-r', "exit(@fsockopen('127.0.0.1',80) ? 0 : 1);"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [laboratory]
  gateway:
    image: nginx:1.28
    depends_on:
      fpm: {condition: service_healthy}
      apache: {condition: service_healthy}
    volumes:
      - application:/app:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LAB_RUNTIME:?}/tls:/tls:ro
      - ${LAB_RUNTIME:?}/control:/control:ro
    networks:
      laboratory:
        ipv4_address: 172.29.231.10
        aliases: [identity.idp.test, one.rp-one.test, two.rp-two.test, identity.idp-alt.test, one.rp-one-alt.test, two.rp-two-alt.test]
  runner:
    image: laravel-sso-deployment-fpm:local
    user: www-data
    environment:
      LAB_PASSWORD: ${LAB_PASSWORD:?}
      SSO_DEPLOYMENT_LAB: "1"
    volumes:
      - application:/app
      - ${LAB_RUNTIME:?}/results:/results
      - ${LAB_RUNTIME:?}/control:/control
      - ${LAB_RUNTIME:?}/tls:/tls:ro
    entrypoint: [php]
    networks: [laboratory]
  browser:
    image: laravel-sso-deployment-browsers:local
    build:
      context: .
      dockerfile: browser.Dockerfile
    init: true
    shm_size: 1gb
    volumes:
      - application:/app:ro
      - ${LAB_RUNTIME:?}/tls:/tls:ro
      - ${LAB_RUNTIME:?}/results:/results
    networks: [laboratory]
networks:
  laboratory:
    internal: true
    ipam:
      config: [{subnet: 172.29.231.0/24}]
volumes:
  application:
    external: true
    name: laravel-sso-deployment-application
