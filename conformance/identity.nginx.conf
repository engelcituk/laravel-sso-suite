events { worker_connections 256; }
http {
    access_log off;
    # Avoid stale reused connections across independent HtmlUnit browser instances.
    keepalive_timeout 0;
    server {
        listen 9443 ssl;
        server_name identity.sso.test;
        ssl_certificate /tls/server.pem;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://identity-php:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 9443;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
