name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [locked, lowest, latest]
    env:
      SSO_DEPENDENCIES: ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node.js 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_sqlite, dom
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist
      - if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - if: matrix.dependencies == 'latest'
        run: composer update --prefer-stable --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: php tools/compatibility-environment.php
      - run: composer test -- --log-junit .runtime/compatibility/junit.xml
      - run: composer test:conformance
      - if: matrix.dependencies == 'locked'
        run: composer lint
      - if: matrix.dependencies == 'locked'
        run: composer analyse
      - run: composer audit --locked
      - run: php tools/setup-examples.php
      - run: php tools/e2e.php
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-php-${{ matrix.php }}-${{ matrix.dependencies }}
          path: |
            .runtime/compatibility/
            .runtime/conformance/junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  package-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node.js 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: for package in packages/* examples/app-one examples/app-two examples/identity-server; do composer validate --strict --no-check-lock "$package/composer.json"; done
  database-concurrency:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]
        isolation: ['READ COMMITTED', 'REPEATABLE READ']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: sso_lab_test
          MYSQL_USER: sso_lab
          MYSQL_PASSWORD: disposable-ci-fixture
        ports: ["13306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sso_lab_test
          POSTGRES_USER: sso_lab
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ["15432:5432"]
        options: >-
          --health-cmd="pg_isready -U sso_lab -d sso_lab_test"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SSO_DATABASE_LAB: "1"
      SSO_TEST_DRIVER: ${{ matrix.database }}
      SSO_TEST_ISOLATION: ${{ matrix.isolation }}
      SSO_TEST_HOST: 127.0.0.1
      SSO_TEST_PORT: ${{ matrix.database == 'mysql' && '13306' || '15432' }}
      SSO_TEST_PASSWORD: disposable-ci-fixture
      SSO_LAB_RESULTS: ${{ github.workspace }}/.runtime/database-lab/results
      SSO_LAB_RUN: ci-${{ matrix.database }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node.js 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, pcntl, dom
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: mkdir -p "$SSO_LAB_RESULTS"
      - run: php vendor/phpunit/phpunit/phpunit --configuration phpunit.database.xml --log-junit "$SSO_LAB_RESULTS/$SSO_LAB_RUN.junit.xml"
      - run: cat "$SSO_LAB_RESULTS/$SSO_LAB_RUN-environment.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sql-${{ matrix.database }}-${{ strategy.job-index }}
          path: |
            .runtime/database-lab/results/*-environment.json
            .runtime/database-lab/results/*.junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
